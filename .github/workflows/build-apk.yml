name: Build TWA APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install tools
        run: |
          npm install -g @bubblewrap/cli
          sudo apt-get install -y expect

      - name: Generate keystore
        run: |
          keytool -genkey -v \
            -keystore android.keystore \
            -alias spendsmart \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass spendsmart123 \
            -keypass spendsmart123 \
            -dname "CN=SpendSmart, OU=App, O=SpendSmart, L=Hyderabad, S=Telangana, C=IN"

      - name: Init Bubblewrap project
        run: |
          JAVA_PATH=$(which java | xargs readlink -f | sed 's|/bin/java||')
          echo "Java path: $JAVA_PATH"
          
          expect << EOF
          set timeout 60
          spawn bubblewrap init --manifest=https://venkatakalyan2461-arch.github.io/Moneytrack/manifest.json --directory=./twa-app
          expect "Do you want Bubblewrap to install the JDK"
          send "n\r"
          expect "Path to your existing JDK 17"
          send "$JAVA_PATH\r"
          expect eof
          EOF
        env:
          BUBBLEWRAP_DISABLE_TELEMETRY: true

      - name: Copy keystore and update config
        run: |
          cp android.keystore twa-app/android.keystore
          python3 -c "
          import json
          with open('twa-app/twa-manifest.json') as f:
              data = json.load(f)
          data['signingKey'] = {'path': './android.keystore', 'alias': 'spendsmart'}
          data['packageId'] = 'com.spendsmart.app'
          with open('twa-app/twa-manifest.json', 'w') as f:
              json.dump(data, f, indent=2)
          print('Config updated')
          "

      - name: Build APK and AAB
        working-directory: twa-app
        run: bubblewrap build
        env:
          BUBBLEWRAP_DISABLE_TELEMETRY: true

      - name: Find build outputs
        run: find . -name "*.apk" -o -name "*.aab" 2>/dev/null

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: spendsmart-build
          path: |
            twa-app/app-release-signed.apk
            twa-app/app-release-bundle.aab
            android.keystore
          if-no-files-found: warn

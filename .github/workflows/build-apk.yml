name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Create Capacitor config
        run: |
          cat > capacitor.config.json << 'EOF'
          {
            "appId": "com.spendsmart.app",
            "appName": "SpendSmart",
            "webDir": "www",
            "server": {
              "url": "https://venkatakalyan2461-arch.github.io/Moneytrack",
              "cleartext": false
            },
            "android": {
              "allowMixedContent": false,
              "captureInput": true,
              "webContentsDebuggingEnabled": false
            }
          }
          EOF

      - name: Create www folder with index
        run: |
          mkdir -p www
          cat > www/index.html << 'EOF'
          <!DOCTYPE html>
          <html>
          <head>
            <meta http-equiv="refresh" content="0; url=https://venkatakalyan2461-arch.github.io/Moneytrack">
          </head>
          <body>Loading SpendSmart...</body>
          </html>
          EOF

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Generate keystore
        run: |
          keytool -genkey -v \
            -keystore release.keystore \
            -alias spendsmart \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass spendsmart123 \
            -keypass spendsmart123 \
            -dname "CN=SpendSmart, OU=App, O=SpendSmart, L=Hyderabad, S=Telangana, C=IN"

      - name: Build Release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=../release.keystore \
            -Pandroid.injected.signing.store.password=spendsmart123 \
            -Pandroid.injected.signing.key.alias=spendsmart \
            -Pandroid.injected.signing.key.password=spendsmart123

      - name: Build Release AAB
        working-directory: android
        run: |
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file=../release.keystore \
            -Pandroid.injected.signing.store.password=spendsmart123 \
            -Pandroid.injected.signing.key.alias=spendsmart \
            -Pandroid.injected.signing.key.password=spendsmart123

      - name: Find APK and AAB
        run: |
          find android -name "*.apk" 2>/dev/null
          find android -name "*.aab" 2>/dev/null

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: spendsmart-release
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab
            release.keystore
          if-no-files-found: warn

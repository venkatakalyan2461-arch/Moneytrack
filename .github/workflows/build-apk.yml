name: Build TWA APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install tools
        run: |
          npm install -g @bubblewrap/cli
          sudo apt-get install -y expect

      - name: Generate keystore
        run: |
          keytool -genkey -v \
            -keystore android.keystore \
            -alias spendsmart \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass spendsmart123 \
            -keypass spendsmart123 \
            -dname "CN=SpendSmart, OU=App, O=SpendSmart, L=Hyderabad, S=Telangana, C=IN"

      - name: Init Bubblewrap project
        run: |
          mkdir -p twa-app
          JAVA_PATH="${JAVA_HOME}"
          ANDROID_PATH="${ANDROID_SDK_ROOT}"

          # Write expect script to file for better handling
          cat > /tmp/bubblewrap_init.exp << EXPECT_SCRIPT
          #!/usr/bin/expect -f
          set timeout 300
          log_user 1

          spawn bubblewrap init --manifest=https://venkatakalyan2461-arch.github.io/Moneytrack/manifest.json --directory=./twa-app

          expect {
            "Do you want Bubblewrap to install the JDK" {
              send "n\r"
              exp_continue
            }
            "Path to your existing JDK 17" {
              send "$JAVA_PATH\r"
              exp_continue
            }
            "Do you want Bubblewrap to install the Android SDK" {
              send "n\r"
              exp_continue
            }
            "Path to your existing Android SDK" {
              send "$ANDROID_PATH\r"
              exp_continue
            }
            "Domain" {
              send "venkatakalyan2461-arch.github.io\r"
              exp_continue
            }
            "URL path" {
              send "/Moneytrack/\r"
              exp_continue
            }
            "Application name" {
              send "SpendSmart\r"
              exp_continue
            }
            "short name" {
              send "SpendSmart\r"
              exp_continue
            }
            "launcher name" {
              send "SpendSmart\r"
              exp_continue
            }
            "display" {
              send "\r"
              exp_continue
            }
            "heme color" {
              send "#1A3C6E\r"
              exp_continue
            }
            "ackground color" {
              send "#1A3C6E\r"
              exp_continue
            }
            "splash" {
              send "#1A3C6E\r"
              exp_continue
            }
            "igning key" {
              send "./android.keystore\r"
              exp_continue
            }
            "ey alias" {
              send "spendsmart\r"
              exp_continue
            }
            "ey password" {
              send "spendsmart123\r"
              exp_continue
            }
            "tore password" {
              send "spendsmart123\r"
              exp_continue
            }
            "ersion code" {
              send "1\r"
              exp_continue
            }
            "ersion name" {
              send "1.0.0\r"
              exp_continue
            }
            "package" {
              send "com.spendsmart.app\r"
              exp_continue
            }
            "(Y/n)" {
              send "\r"
              exp_continue
            }
            "(y/N)" {
              send "\r"
              exp_continue
            }
            eof {
              puts "Done!"
            }
          }
          EXPECT_SCRIPT

          chmod +x /tmp/bubblewrap_init.exp
          expect /tmp/bubblewrap_init.exp
        env:
          BUBBLEWRAP_DISABLE_TELEMETRY: true

      - name: Check twa-app contents
        run: |
          echo "=== twa-app contents ==="
          ls -la twa-app/
          echo "=== manifest ==="
          cat twa-app/twa-manifest.json 2>/dev/null || echo "No manifest yet"

      - name: Copy keystore and update config
        run: |
          cp android.keystore twa-app/android.keystore
          python3 << 'PYEOF'
          import json
          with open('twa-app/twa-manifest.json') as f:
              data = json.load(f)
          data['signingKey'] = {'path': './android.keystore', 'alias': 'spendsmart'}
          data['packageId'] = 'com.spendsmart.app'
          with open('twa-app/twa-manifest.json', 'w') as f:
              json.dump(data, f, indent=2)
          print('Config updated successfully')
          PYEOF

      - name: Build APK and AAB
        working-directory: twa-app
        run: bubblewrap build
        env:
          BUBBLEWRAP_DISABLE_TELEMETRY: true

      - name: Find outputs
        run: find . -name "*.apk" -o -name "*.aab" 2>/dev/null || echo "No files found"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: spendsmart-build
          path: |
            twa-app/app-release-signed.apk
            twa-app/app-release-bundle.aab
            android.keystore
          if-no-files-found: warn

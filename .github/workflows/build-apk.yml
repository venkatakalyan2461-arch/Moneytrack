name: Build TWA APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Pre-configure Bubblewrap (skip all prompts)
        run: |
          mkdir -p ~/.bubblewrap
          cat > ~/.bubblewrap/config.json << EOF
          {
            "jdkPath": "${JAVA_HOME}",
            "androidSdkPath": "${ANDROID_SDK_ROOT}"
          }
          EOF
          echo "=== Bubblewrap config ==="
          cat ~/.bubblewrap/config.json

      - name: Generate keystore
        run: |
          keytool -genkey -v \
            -keystore android.keystore \
            -alias spendsmart \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass spendsmart123 \
            -keypass spendsmart123 \
            -dname "CN=SpendSmart, OU=App, O=SpendSmart, L=Hyderabad, S=Telangana, C=IN"

      - name: Create TWA manifest
        run: |
          mkdir -p twa-app
          cp android.keystore twa-app/android.keystore
          cat > twa-app/twa-manifest.json << EOF
          {
            "packageId": "com.spendsmart.app",
            "host": "venkatakalyan2461-arch.github.io",
            "name": "SpendSmart",
            "launcherName": "SpendSmart",
            "display": "standalone",
            "themeColor": "#1A3C6E",
            "navigationColor": "#1A3C6E",
            "navigationColorDark": "#1A3C6E",
            "navigationDividerColor": "#1A3C6E",
            "navigationDividerColorDark": "#1A3C6E",
            "backgroundColor": "#1A3C6E",
            "enableNotifications": true,
            "startUrl": "/Moneytrack/",
            "iconUrl": "https://venkatakalyan2461-arch.github.io/Moneytrack/icon-512.png",
            "maskableIconUrl": "https://venkatakalyan2461-arch.github.io/Moneytrack/icon-512.png",
            "monochromeIconUrl": "https://venkatakalyan2461-arch.github.io/Moneytrack/icon-512.png",
            "shortcuts": [],
            "signingKey": {
              "path": "./android.keystore",
              "alias": "spendsmart"
            },
            "appVersionName": "1.0.0",
            "appVersionCode": 1,
            "minSdkVersion": 19,
            "orientation": "portrait",
            "fingerprints": [],
            "additionalTrustedOrigins": [],
            "retainedBundles": [],
            "webManifestUrl": "https://venkatakalyan2461-arch.github.io/Moneytrack/manifest.json",
            "generatorApp": "bubblewrap-cli",
            "sdkDir": "${ANDROID_SDK_ROOT}",
            "jdkDir": "${JAVA_HOME}"
          }
          EOF
          echo "=== twa-manifest.json ==="
          cat twa-app/twa-manifest.json

      - name: Generate Android project
        working-directory: twa-app
        run: |
          sudo apt-get install -y expect -q
          expect << 'EOF'
          set timeout 60
          spawn bubblewrap update
          expect "versionName"
          send "1.0.0\r"
          expect "versionCode"
          send "1\r"
          expect eof
          EOF
        env:
          BUBBLEWRAP_DISABLE_TELEMETRY: true

      - name: Build APK and AAB
        working-directory: twa-app
        run: |
          expect << 'EOF'
          set timeout 300
          spawn bubblewrap build
          expect "Password for the Key Store"
          send "spendsmart123\r"
          expect "Password for the Key"
          send "spendsmart123\r"
          expect eof
          EOF
        env:
          BUBBLEWRAP_DISABLE_TELEMETRY: true

      - name: Find outputs
        run: find . -name "*.apk" -o -name "*.aab" 2>/dev/null || echo "No files found"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: spendsmart-build
          path: |
            twa-app/app-release-signed.apk
            twa-app/app-release-bundle.aab
            android.keystore
          if-no-files-found: warn

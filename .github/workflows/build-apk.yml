name: Build TWA APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Generate keystore
        run: |
          keytool -genkey -v \
            -keystore android.keystore \
            -alias spendsmart \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass spendsmart123 \
            -keypass spendsmart123 \
            -dname "CN=SpendSmart, OU=App, O=SpendSmart, L=Hyderabad, S=Telangana, C=IN"

      - name: Init Bubblewrap project
        run: |
          echo "n" | bubblewrap init \
            --manifest=https://venkatakalyan2461-arch.github.io/Moneytrack/manifest.json \
            --directory=./twa-app
        env:
          BUBBLEWRAP_DISABLE_TELEMETRY: true
          JAVA_HOME: ${{ env.JAVA_HOME }}

      - name: Copy keystore
        run: cp android.keystore twa-app/android.keystore

      - name: Update signing config
        working-directory: twa-app
        run: |
          cat twa-manifest.json | \
          python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          data['signingKey'] = {'path': './android.keystore', 'alias': 'spendsmart'}
          data['packageId'] = 'com.spendsmart.app'
          print(json.dumps(data, indent=2))
          " > twa-manifest-new.json
          mv twa-manifest-new.json twa-manifest.json

      - name: Build APK and AAB
        working-directory: twa-app
        run: |
          bubblewrap build \
            --signingKeyPath=./android.keystore \
            --signingKeyAlias=spendsmart \
            --signingKeyPassword=spendsmart123 \
            --signingStorePassword=spendsmart123
        env:
          BUBBLEWRAP_DISABLE_TELEMETRY: true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: spendsmart-build
          path: |
            twa-app/app-release-signed.apk
            twa-app/app-release-bundle.aab
            android.keystore
